<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Nick Tomlinson</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Back</a>
    <h1>Contact</h1>

    <!-- Replace the email address and Instagram handle below with your own. -->
    <div class="contact-details">
      <p><a href="mailto:you@example.com">you@example.com</a></p>
      <p><a href="https://www.instagram.com/yourhandle/" rel="noopener">Instagram: @yourhandle</a></p>
    </div>

    <h2>Send me a message</h2>
    <!-- FormSubmit emails each submission to the address in the action URL.
         The first submission sends a one-time confirmation email to that address. -->
    <form class="contact-form" action="https://formsubmit.co/you@example.com" method="POST">
      <input type="hidden" name="_subject" value="New message from your website">
      <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
